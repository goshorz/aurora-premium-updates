name: Mirror official Aurora Premium 1.3.28 APK to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mirror-aurora1328-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: goshorz/aurora-premium-releases
          ref: main
          path: signed-source
          persist-credentials: false
          sparse-checkout: |
            incoming/aurora1328
          sparse-checkout-cone-mode: false
      - name: Reconstruct and verify identical signed APK from audited chunks
        shell: bash
        run: |
          set -euo pipefail
          DIR=signed-source/incoming/aurora1328
          test "$(find "$DIR" -name 'part-*' | wc -l)" -eq 26
          test "$(cat "$DIR/bytes.txt")" = '2310701'
          test "$(cat "$DIR/sha256.txt")" = '9d42c12be14ae89b6604444e7e314fc8395b7ce6153a171e337f012e4645d064'
          mkdir -p downloads
          cat "$DIR"/part-* | base64 --decode > downloads/Aurora-Premium-1.3.28-Official-SIGNED.apk
          test "$(stat -c %s downloads/Aurora-Premium-1.3.28-Official-SIGNED.apk)" -eq 2310701
          echo "9d42c12be14ae89b6604444e7e314fc8395b7ce6153a171e337f012e4645d064  downloads/Aurora-Premium-1.3.28-Official-SIGNED.apk" | sha256sum -c
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging downloads/Aurora-Premium-1.3.28-Official-SIGNED.apk | grep "^package:" | tee package.txt
          grep -q "name='bg.razgrad.aurorapremium'" package.txt
          grep -q "versionCode='160'" package.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs downloads/Aurora-Premium-1.3.28-Official-SIGNED.apk | tee signing.txt
          grep -qi '10efc5ad6c3b56f549ac78d571876ea1a102594958cd6b9660486f0954202ab7' signing.txt
          echo 'PASS: same production signed APK, byte-for-byte'
      - name: Publish only the verified APK under existing GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/Aurora-Premium-1.3.28-Official-SIGNED.apk
          if git diff --cached --quiet; then
            echo 'Already published, no change'
          else
            git commit -m 'download: mirror official signed Aurora Premium 1.3.28 for alternate web delivery'
            git push origin HEAD:main
          fi
          echo 'Published alternate download; OTA manifest remains unchanged'
