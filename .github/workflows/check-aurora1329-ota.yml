name: Verify Aurora Premium 1.3.29 live OTA (signed APK and Pages)

on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Confirm official signed release, SHA256, and live OTA manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          data=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          if int(data.get('versionCode',0))>161:
              print('SKIP: a newer Aurora version is already published')
              raise SystemExit(0)
          assert data['versionCode']==161, data
          assert data['versionName']=='1.3.29'
          expected_url='https://github.com/goshorz/aurora-premium-releases/releases/download/v1.3.29-official/Aurora-Premium-1.3.29-Official-SIGNED.apk'
          assert data['downloadUrl']==expected_url
          request=urllib.request.Request(
              'https://api.github.com/repos/goshorz/aurora-premium-releases/releases/tags/v1.3.29-official',
              headers={'Accept':'application/vnd.github+json','User-Agent':'Aurora-OTA-1329-Verification'})
          with urllib.request.urlopen(request,timeout=15) as response:
              release=json.load(response)
          assert not release['draft'] and not release['prerelease']
          assert any(a.get('browser_download_url')==expected_url and a.get('size')==2311525
              and a.get('digest')=='sha256:77eeccc19f065217feb6576b76ba10b107fe80e115ab51dd06d744e3bb409265'
              and a.get('state')=='uploaded' for a in release['assets']),release['assets']
          print('PASS: signed public release, size and hash match')
          page='https://goshorz.github.io/aurora-premium-updates/manifest.json'
          for attempt in range(22):
              try:
                  req=urllib.request.Request(
                      page+'?v=1329&t='+str(time.time_ns()),
                      headers={'Cache-Control':'no-cache','User-Agent':'Aurora-OTA-1329-Verification'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      served=json.load(response)
                  assert served.get('versionCode')==160,served
                  assert served.get('versionName')=='1.3.29',served
                  assert served.get('downloadUrl')==expected_url,served
                  print('PASS: LIVE Aurora 1.3.29 OTA manifest verified')
                  break
              except Exception as error:
                  print('Pages propagation attempt',attempt+1,str(error)[:150])
                  if attempt==21:
                      raise
                  time.sleep(8)
          PY
