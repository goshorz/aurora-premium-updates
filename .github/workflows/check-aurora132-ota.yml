name: Validate live Aurora Premium 1.3.2 OTA feed
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repo manifest and public GitHub Pages mirror
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          doc=json.loads(Path("manifest.json").read_text())
          assert doc["versionCode"]==134 and doc["versionName"]=="1.3.2"
          expected="https://github.com/goshorz/aurora-premium-releases/releases/download/v1.3.2-official/Aurora-Premium-1.3.2-Unified-SIGNED.apk"
          assert doc["downloadUrl"]==expected
          page="https://goshorz.github.io/aurora-premium-updates/manifest.json"
          last=None
          for i in range(12):
            try:
              req=urllib.request.Request(page+"?ota_probe="+str(i),headers={"Cache-Control":"no-cache","User-Agent":"Aurora-OTA-Validation"})
              with urllib.request.urlopen(req, timeout=12) as response:
                served=json.load(response)
              assert served.get("versionCode")==134, "served older version: "+str(served.get("versionCode"))
              assert served.get("downloadUrl")==expected, "unexpected public downloadUrl"
              print("PUBLIC OTA OK: ",served["versionName"],served["versionCode"],served["downloadUrl"])
              break
            except Exception as e:
              last=str(e)
              print("Waiting for GitHub Pages propagation:",i+1,last)
              if i==11: raise
              time.sleep(8)
          PY
