name: Validate live Aurora Premium 1.3.5 official LED-weather OTA
on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify OTA manifest, published signed APK, and GitHub Pages propagation
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          manifest=json.loads(Path("manifest.json").read_text())
          expected_url="https://github.com/goshorz/aurora-premium-releases/releases/download/v1.3.5-official/Aurora-Premium-1.3.5-LED-Rain-Snow-SIGNED.apk"
          expected_digest="sha256:6fd4227f50637b3b81335c818f33792e34c46168573dcf8c20bde5ed87fdec8a"
          assert manifest["versionCode"] == 137
          assert manifest["versionName"] == "1.3.5"
          assert manifest["downloadUrl"] == expected_url
          req=urllib.request.Request("https://api.github.com/repos/goshorz/aurora-premium-releases/releases/tags/v1.3.5-official",
            headers={"Accept":"application/vnd.github+json","User-Agent":"Aurora-OTA-Validation"})
          with urllib.request.urlopen(req,timeout=15) as response:
            release=json.load(response)
          assert not release["draft"] and not release["prerelease"]
          assert len(release["assets"]) >= 1
          assert any(a["browser_download_url"]==expected_url and a.get("digest")==expected_digest and
                     a["size"] == 2280842 for a in release["assets"])
          page="https://goshorz.github.io/aurora-premium-updates/manifest.json"
          for trial in range(18):
            try:
              url=page+"?v=135&t="+str(time.time_ns())
              request=urllib.request.Request(url,headers={
                "Cache-Control":"no-cache","User-Agent":"Aurora-OTA-Validation"})
              with urllib.request.urlopen(request,timeout=15) as response:
                served=json.load(response)
              assert served.get("versionCode")==137, "not propagated: "+str(served.get("versionCode"))
              assert served.get("versionName")=="1.3.5"
              assert served.get("downloadUrl")==expected_url
              print("Aurora Premium 1.3.5 OTA LIVE AND VERIFIED; original-certificate release exists.")
              break
            except Exception as exc:
              print("Awaiting Pages propagation",trial+1,str(exc)[:220])
              if trial==17:raise
              time.sleep(8)
          PY
