name: Validate LIVE Aurora Premium 1.3.6 original-signed OTA
on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - '.github/workflows/check-aurora136-ota.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed public GitHub Release and check live GitHub Pages manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          current=json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          name="Aurora-Premium-1.3.6-Official-SIGNED.apk"
          url="https://github.com/goshorz/aurora-premium-releases/releases/download/v1.3.6-official/"+name
          digest="sha256:d2f13e5792f444c0d478ec1fb1198f55ea5c1bef1c0a32f0354ac8c34ad4f5b0"
          assert current["versionCode"]==138 and current["versionName"]=="1.3.6",current
          assert current["downloadUrl"]==url,current["downloadUrl"]
          req=urllib.request.Request(
            "https://api.github.com/repos/goshorz/aurora-premium-releases/releases/tags/v1.3.6-official",
            headers={"Accept":"application/vnd.github+json","User-Agent":"Aurora-OTA-136-Verification"})
          with urllib.request.urlopen(req,timeout=15) as response:release=json.load(response)
          assert not release["draft"] and not release["prerelease"]
          assert any(asset["browser_download_url"]==url and asset["size"]==2295670
                     and asset.get("digest")==digest and asset["state"]=="uploaded"
                     for asset in release["assets"])
          page="https://goshorz.github.io/aurora-premium-updates/manifest.json"
          for attempt in range(18):
            try:
              request=urllib.request.Request(page+"?v=136&t="+str(time.time_ns()),
                headers={"Cache-Control":"no-cache","User-Agent":"Aurora-OTA-136-Verification"})
              with urllib.request.urlopen(request,timeout=15) as response: served=json.load(response)
              assert served.get("versionCode")==138,"Pages still serves "+str(served.get("versionCode"))
              assert served.get("versionName")=="1.3.6"
              assert served.get("downloadUrl")==url
              print("PASS: LIVE Aurora Premium 1.3.6 OTA manifest confirmed, official signed APK digest/size matched.")
              break
            except Exception as error:
              print("Pages propagation",attempt+1,str(error)[:200])
              if attempt==17:raise
              time.sleep(8)
          PY
