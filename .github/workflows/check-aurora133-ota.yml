name: Validate live Aurora Premium 1.3.3 Foreca OTA feed
on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - '.github/workflows/check-aurora133-ota.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifest and GitHub Pages current version
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          repo=json.loads(Path("manifest.json").read_text())
          expected="https://github.com/goshorz/aurora-premium-releases/releases/download/v1.3.3-official/Aurora-Premium-1.3.3-Foreca-SIGNED.apk"
          assert repo["versionCode"]==135 and repo["versionName"]=="1.3.3"
          assert repo["downloadUrl"]==expected
          page="https://goshorz.github.io/aurora-premium-updates/manifest.json"
          for trial in range(16):
            try:
              req=urllib.request.Request(page+"?v=133&t="+str(trial),
                   headers={"Cache-Control":"no-cache","User-Agent":"Aurora-OTA-Validation"})
              with urllib.request.urlopen(req,timeout=12) as response:
                served=json.load(response)
              assert served.get("versionCode")==135,"Not propagated: "+str(served.get("versionCode"))
              assert served.get("versionName")=="1.3.3"
              assert served.get("downloadUrl")==expected
              print("Aurora Premium 1.3.3 OTA LIVE AND VERIFIED")
              break
            except Exception as e:
              print("GitHub Pages propagation",trial+1,str(e)[:220])
              if trial==15:raise
              time.sleep(8)
          PY
