name: Validate LIVE Aurora Premium 1.3.16 original-signed OTA
on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed public GitHub Release and check live GitHub Pages manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          current=json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          if current.get("versionCode",0)>148:
            print("SKIP: Aurora 1.3.16 historical check, newer version already active")
            raise SystemExit(0)
          name="Aurora-Premium-1.3.16-Official-SIGNED.apk"
          url="https://github.com/goshorz/aurora-premium-releases/releases/download/v1.3.16-official/"+name
          digest="sha256:087eeaebde1271723034475cfee3517705b2ef9fc00d6e8b531e088a9e766301"
          assert current["versionCode"]==148 and current["versionName"]=="1.3.16",current
          assert current["downloadUrl"]==url,current["downloadUrl"]
          req=urllib.request.Request(
            "https://api.github.com/repos/goshorz/aurora-premium-releases/releases/tags/v1.3.16-official",
            headers={"Accept":"application/vnd.github+json","User-Agent":"Aurora-OTA-1316-Verification"})
          with urllib.request.urlopen(req,timeout=15) as response:release=json.load(response)
          assert not release["draft"] and not release["prerelease"]
          assert any(asset["browser_download_url"]==url and asset["size"]==2301439
                     and asset.get("digest")==digest and asset["state"]=="uploaded"
                     for asset in release["assets"])
          page="https://goshorz.github.io/aurora-premium-updates/manifest.json"
          for attempt in range(18):
            try:
              request=urllib.request.Request(page+"?v=1316&t="+str(time.time_ns()),
                headers={"Cache-Control":"no-cache","User-Agent":"Aurora-OTA-1316-Verification"})
              with urllib.request.urlopen(request,timeout=15) as response: served=json.load(response)
              assert served.get("versionCode")==148,"Pages still serves "+str(served.get("versionCode"))
              assert served.get("versionName")=="1.3.16"
              assert served.get("downloadUrl")==url
              print("PASS: LIVE Aurora Premium 1.3.16 OTA manifest confirmed, official signed APK digest/size matched.")
              break
            except Exception as error:
              print("Pages propagation",attempt+1,str(error)[:200])
              if attempt==17:raise
              time.sleep(8)
          PY
