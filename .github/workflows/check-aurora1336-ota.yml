name: Verify Aurora Premium 1.3.36 live OTA (signed APK and Pages)

on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - '.github/workflows/check-aurora1336-ota.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Confirm official signed release, SHA256, and live OTA manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          data=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          if int(data.get('versionCode',0))>168:
              print('SKIP: a newer Aurora version is already published')
              raise SystemExit(0)
          assert data['versionCode']==168, data
          assert data['versionName']=='1.3.36'
          expected_url='https://github.com/goshorz/aurora-premium-releases/releases/download/v1.3.36-official/Aurora-Premium-1.3.36-Official-SIGNED.apk'
          assert data['downloadUrl']==expected_url
          request=urllib.request.Request(
              'https://api.github.com/repos/goshorz/aurora-premium-releases/releases/tags/v1.3.36-official',
              headers={'Accept':'application/vnd.github+json','User-Agent':'Aurora-OTA-1336-Verification'})
          with urllib.request.urlopen(request,timeout=15) as response:
              release=json.load(response)
          assert not release['draft'] and not release['prerelease']
          assert any(a.get('browser_download_url')==expected_url and a.get('size')==2312329
              and a.get('digest')=='sha256:ffac5e25ef66877084fab58a1b5c352762dc8f71010ebd25fd8f9f8acbca8bcc'
              and a.get('state')=='uploaded' for a in release['assets']),release['assets']
          print('PASS: signed public release, size and hash match')
          page='https://goshorz.github.io/aurora-premium-updates/manifest.json'
          for attempt in range(22):
              try:
                  req=urllib.request.Request(
                      page+'?v=1336&t='+str(time.time_ns()),
                      headers={'Cache-Control':'no-cache','User-Agent':'Aurora-OTA-1336-Verification'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      served=json.load(response)
                  assert served.get('versionCode')==168,served
                  assert served.get('versionName')=='1.3.36',served
                  assert served.get('downloadUrl')==expected_url,served
                  print('PASS: LIVE Aurora 1.3.36 OTA manifest verified')
                  break
              except Exception as error:
                  print('Pages propagation attempt',attempt+1,str(error)[:150])
                  if attempt==21:
                      raise
                  time.sleep(8)
          PY
